services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Credentials + config live in backend/.env (copy backend/.env.example).
    # env_file is read at `docker compose up` time on the host; nothing
    # secret is baked into the image. Paths are relative to this file.
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines env vars at BUILD time, so the API base URL must be
        # passed as a build arg, not a runtime env var. Defaults to the
        # localhost dev backend. To override for a non-local host, run:
        #   docker compose --env-file backend/.env up -d --build
        # (that makes compose read VITE_API_BASE_URL from backend/.env).
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - backend
